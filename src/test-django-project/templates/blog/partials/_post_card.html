{% load i18n %}
<article class="rounded-xl border border-gray-200 bg-white p-4 transition-shadow hover:shadow-md">
  <h3 class="font-semibold text-gray-900">{{ post.title }}</h3>
  <p class="mt-1 text-sm text-gray-500">
    {% trans "by" %} {{ post.author.name }} · {{ post.created|date:"M d, Y" }}
  </p>
  <p class="mt-2 text-sm text-gray-700">{{ post.excerpt }}</p>
  {% if post.category %}
    <span class="mt-3 inline-block rounded-full bg-indigo-50 px-2 py-0.5 text-xs text-indigo-700">
      {{ post.category.name }}
    </span>
  {% endif %}
</article>
