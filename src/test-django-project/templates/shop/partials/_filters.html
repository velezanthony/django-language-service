{% load i18n %}

<aside class="w-full lg:w-72 shrink-0" x-data="{ open: false }">
    <button @click="open = !open"
        class="lg:hidden w-full flex items-center justify-between py-3 px-4 bg-white rounded-xl ring-1 ring-gray-900/5 shadow-sm text-sm font-semibold text-gray-700 mb-6 hover:bg-gray-50 transition-colors">
        <span class="flex items-center gap-2">
            <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
            {% trans "Filters" %}
        </span>
        <svg class="w-5 h-5 text-gray-400 transition-transform duration-200" :class="{ 'rotate-180': open }" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </button>

    <div :class="{ 'hidden lg:block': !open }" class="space-y-8 bg-white rounded-2xl ring-1 ring-gray-900/5 shadow-sm p-6">
        <!-- Search -->
        <div>
            <label class="block text-sm font-semibold text-gray-900 mb-2.5">{% trans "Search" %}</label>
            <div class="relative">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text"
                    value="{{ search_query }}"
                    placeholder="{% trans 'Search products...' %}"
                    class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none">
            </div>
        </div>

        <!-- Categories -->
        <div>
            <h3 class="text-sm font-semibold text-gray-900 mb-3">{% trans "Categories" %}</h3>
            <div class="space-y-0.5">
                {% for category in categories %}
                    <a href="?category={{ category.slug }}"
                        class="flex items-center justify-between py-2 px-3 -mx-3 text-sm text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors duration-150">
                        <span class="font-medium">{{ category.name }}</span>
                        <span class="text-xs font-medium text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">{{ category.product_count }}</span>
                    </a>
                {% endfor %}
            </div>
        </div>

        <!-- Price range -->
        <div x-data="{ min: 0, max: 1000 }">
            <h3 class="text-sm font-semibold text-gray-900 mb-3">{% trans "Price Range" %}</h3>
            <div class="flex items-center gap-3">
                <div class="relative flex-1">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-400 font-medium">$</span>
                    <input type="number" x-model="min"
                        class="w-full pl-7 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none tabular-nums"
                        placeholder="Min">
                </div>
                <span class="text-gray-300 font-medium">—</span>
                <div class="relative flex-1">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-400 font-medium">$</span>
                    <input type="number" x-model="max"
                        class="w-full pl-7 pr-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none tabular-nums"
                        placeholder="Max">
                </div>
            </div>
            <button class="mt-3 w-full py-2 text-sm font-semibold text-indigo-600 bg-indigo-50 rounded-xl hover:bg-indigo-100 transition-colors">
                {% trans "Apply" %}
            </button>
        </div>
    </div>
</aside>
