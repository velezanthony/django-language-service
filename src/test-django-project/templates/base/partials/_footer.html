{% load i18n %}

<footer class="bg-white border-t border-gray-200 mt-auto">
    <div class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-gray-900">{{ site_name }}</span>
                <span class="text-gray-300">|</span>
                <p class="text-sm text-gray-500">
                    &copy; {{ current_year }} {% trans "All rights reserved." %}
                </p>
            </div>
            <div class="flex items-center gap-6">
                <a href="#" class="text-sm text-gray-500 hover:text-gray-700 transition-colors">{% trans "Privacy" %}</a>
                <a href="#" class="text-sm text-gray-500 hover:text-gray-700 transition-colors">{% trans "Terms" %}</a>
                <a href="#" class="text-sm text-gray-500 hover:text-gray-700 transition-colors">{% trans "Support" %}</a>
            </div>
        </div>
    </div>
</footer>
