{% load shop_tags %}
{% load i18n %}

<div class="group bg-white rounded-2xl shadow-sm ring-1 ring-gray-900/5 overflow-hidden hover:shadow-lg hover:ring-gray-900/10 transition-all duration-300"
    x-data="{ hover: false }"
    @mouseenter="hover = true"
    @mouseleave="hover = false">

    <a href="{% url 'product_detail' product.slug %}" class="block">
        <div class="aspect-square bg-gray-100 overflow-hidden relative">
            {% if product.featured_image %}
                <img src="{{ product.featured_image.url }}"
                    alt="{{ product.name }}"
                    class="w-full h-full object-cover transition-transform duration-500 ease-out"
                    :class="{ 'scale-110': hover }">
            {% else %}
                <div class="w-full h-full flex items-center justify-center text-gray-300 bg-gradient-to-br from-gray-50 to-gray-100">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
            {% endif %}
            <!-- Quick view overlay -->
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors duration-300 flex items-end justify-center pb-4 opacity-0 group-hover:opacity-100">
                <span class="px-4 py-2 bg-white/90 backdrop-blur-sm text-sm font-semibold text-gray-900 rounded-lg shadow-sm transform translate-y-2 group-hover:translate-y-0 transition-transform duration-300">
                    {% trans "Quick View" %}
                </span>
            </div>
        </div>

        <div class="p-4 sm:p-5">
            <p class="text-xs font-medium text-indigo-600 uppercase tracking-wider">{{ product.category.name }}</p>
            <h3 class="font-semibold text-gray-900 mt-1.5 group-hover:text-indigo-600 transition-colors duration-200 line-clamp-1">{{ product.name }}</h3>
            <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-100">
                <span class="text-lg font-bold text-gray-900">{{ product.price|currency }}</span>
                {% if product.avg_rating %}
                    <span class="text-sm text-yellow-500">{{ product.avg_rating|star_rating }}</span>
                {% endif %}
            </div>
        </div>
    </a>
</div>
