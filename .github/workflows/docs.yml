# Publishes https://velezanthony.github.io/django-language-service/
#
# The site is the Astro project in docs-site/, built with @velezanthony/design.
# It has its own package.json and lockfile, so nothing here touches the
# extension's dependencies, build or packaging.
#
# The paths filter is wide because the pages are the documents themselves:
# README.md, CHANGELOG.md, CONTRIBUTING.md and SECURITY.md have to stay where
# GitHub and the Marketplace expect them, so any of them can change the
# published site. src/docs-workflow.test.ts keeps this list in step with
# docs-site/docs.config.mjs.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      # Full history: the sitemap's <lastmod> is each document's last commit,
      # and a shallow clone has none.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - uses: actions/configure-pages@v6

      - run: npm ci

      # The build fails on a broken internal link or anchor, so the deploy job
      # below never runs and nothing broken is published.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
